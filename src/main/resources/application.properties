spring.config.import=optional:file:./src/main/resources/application-secret.properties

# Database Configuration
spring.application.name=zipstore-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/zipstoredb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Key
security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=36000000